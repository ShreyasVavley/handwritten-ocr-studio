name: ScribeCraft CI & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y libgl1-mesa-glx

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Integrity & Unit Tests
      run: |
        python -c "import flask, PIL, pypdfium2, docx, reportlab; print('Core dependencies OK')"
        python -c "from enhancement import enhance_image; print('Enhancement module OK')"
        python -c "from exporters import export_to_docx, export_to_pdf; print('Exporters OK')"
